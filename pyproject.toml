[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-db"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_db"]
exclude = ["src/controlplane_db/alembic/**", "src/controlplane_db/migration_chains/**", "src/controlplane_db/alembic.ini"]

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "src", "tests", "scripts", "README.md", "AGENTS.md", "alembic.ini", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "testcontainers[postgres]>=4.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: disposable PostgreSQL owner integration", "migration_start(revision): start from a frozen historical revision"]
