name: Standalone package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Prepare build-local package output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/db-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify public dependencies without inherited credentials
        env:
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/database-test-results
        run: >-
          bash scripts/anonymous-command.sh env
          TEST_EVIDENCE_DIR="$TEST_EVIDENCE_DIR"
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          bash scripts/check-package.sh --contracts
      - name: Qualify storage schema with restricted PostgreSQL roles
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: >-
          bash scripts/anonymous-command.sh env
          TEST_DATABASE_URL="$TEST_DATABASE_URL"
          uv run --frozen --python 3.13 pytest -v qualification/storage_tests
          --junitxml="$RUNNER_TEMP/database-test-results/storage.xml"
      - name: Prepare and inspect GHCR consumer image
        env:
          QUALIFIED_DIST_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
        run: >-
          bash scripts/anonymous-command.sh env
          QUALIFIED_DIST_DIR="$QUALIFIED_DIST_DIR"
          GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID"
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          bash scripts/check-container.sh
      - name: Remove build-local package output
        if: always()
        run: rm -rf -- "$RELEASE_ARTIFACT_DIR"
